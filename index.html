  {

    "ch": 7,
    "page": 222,
    "topic": "infection control",
    "q": "Does antiseptic cleaning sterilize the puncture site?",
    "a": "No. It reduces microbes but does not sterilize the skin."
  },
  {
    "id": "cc-7-014",
    "ch": 7,
    "page": 222,
    "topic": "infection control",
    "q": "When is alcohol-based hand sanitizer appropriate?",
    "a": "When hands are not visibly soiled, according to facility policy."
  },
  {
    "id": "cc-7-015",
    "ch": 7,
    "page": 223,
    "topic": "aftercare",
    "q": "Why is gauze preferred over cotton balls for puncture pressure?",
    "a": "Cotton fibers can stick to the site and disturb the platelet plug."
  },
  {
    "id": "cc-7-016",
    "ch": 7,
    "page": 223,
    "topic": "aftercare",
    "q": "When may an adhesive bandage be applied?",
    "a": "After the collection site has stopped bleeding."
  },
  {
    "id": "cc-7-017",
    "ch": 7,
    "page": 223,
    "topic": "safety",
    "q": "Where must used needles and lancets go immediately?",
    "a": "Into an approved sharps container."
  },
  {
    "id": "cc-7-018",
    "ch": 7,
    "page": 223,
    "topic": "safety",
    "q": "Why must sharps containers not be overfilled?",
    "a": "Overfilling raises the risk of needlestick injuries."
  },
  {
    "id": "cc-7-019",
    "ch": 7,
    "page": 224,
    "topic": "records",
    "q": "Why should a phlebotomist carry a permanent pen?",
    "a": "To label tubes and record information clearly."
  },
  {
    "id": "cc-7-020",
    "ch": 7,
    "page": 224,
    "topic": "records",
    "q": "Why is a watch or second-hand timer helpful?",
    "a": "For accurate timed tests and recording collection times."
  },
  {
    "id": "cc-7-021",
    "ch": 7,
    "page": 224,
    "topic": "equipment",
    "q": "What is a vein-locating device used for?",
    "a": "Highlighting veins that are difficult to see or palpate."
  },
  {
    "id": "cc-7-022",
    "ch": 7,
    "page": 225,
    "topic": "tourniquet",
    "q": "What does a properly applied tourniquet do?",
    "a": "Restricts venous return so veins become easier to locate."
  },
  {
    "id": "cc-7-023",
    "ch": 7,
    "page": 225,
    "topic": "tourniquet",
    "q": "What is the maximum recommended tourniquet application time?",
    "a": "No longer than 1 minute without release."
  },
  {
    "id": "cc-7-024",
    "ch": 7,
    "page": 225,
    "topic": "tourniquet",
    "q": "Why should nonlatex tourniquets be used?",
    "a": "To reduce reactions in patients with latex sensitivities."
  },
  {
    "id": "cc-7-025",
    "ch": 7,
    "page": 226,
    "topic": "needles",
    "q": "Are phlebotomy needles reusable?",
    "a": "No. They are sterile, disposable, single-use devices."
  },
  {
    "id": "cc-7-026",
    "ch": 7,
    "page": 226,
    "topic": "needles",
    "q": "What is a needle bevel?",
    "a": "The angled cut at the point that helps the needle enter tissue."
  },
  {
    "id": "cc-7-027",
    "ch": 7,
    "page": 226,
    "topic": "needles",
    "q": "What happens to needle diameter as gauge number increases?",
    "a": "The needle diameter decreases."
  },
  {
    "id": "cc-7-028",
    "ch": 7,
    "page": 227,
    "topic": "needles",
    "q": "Which needle gauge is standard for routine adult antecubital venipuncture?",
    "a": "21 gauge."
  },
  {
    "id": "cc-7-029",
    "ch": 7,
    "page": 227,
    "topic": "needles",
    "q": "Which needle gauge is commonly chosen for smaller veins?",
    "a": "22 gauge, depending on patient and collection method."
  },
  {
    "id": "cc-7-030",
    "ch": 7,
    "page": 227,
    "topic": "needles",
    "q": "What is a risk of using a needle that is too small?",
    "a": "Specimen hemolysis."
  },
  {
    "id": "cc-7-031",
    "ch": 7,
    "page": 227,
    "topic": "needles",
    "q": "What is a risk of using a needle that is too large?",
    "a": "Unnecessary vein damage."
  },
  {
    "id": "cc-7-032",
    "ch": 7,
    "page": 228,
    "topic": "safety",
    "q": "What should a needle safety feature do after use?",
    "a": "Create a permanent barrier against the contaminated needle."
  },
  {
    "id": "cc-7-033",
    "ch": 7,
    "page": 228,
    "topic": "safety",
    "q": "Can a device without a needle safety feature be used unprotected?",
    "a": "No. Compatible equipment must provide required sharps protection."
  },
  {
    "id": "cc-7-034",
    "ch": 7,
    "page": 228,
    "topic": "ETS",
    "q": "What does ETS stand for?",
    "a": "Evacuated tube system."
  },
  {
    "id": "cc-7-035",
    "ch": 7,
    "page": 228,
    "topic": "ETS",
    "q": "What are the three basic ETS components?",
    "a": "Multisample needle, tube holder, and evacuated tube."
  },
  {
    "id": "cc-7-036",
    "ch": 7,
    "page": 229,
    "topic": "ETS",
    "q": "Why can an ETS collect multiple tubes from one venipuncture?",
    "a": "Its multisample needle allows successive vacuum tubes to be attached."
  },
  {
    "id": "cc-7-037",
    "ch": 7,
    "page": 230,
    "topic": "ETS",
    "q": "Why should ETS components generally come from the same manufacturer?",
    "a": "Mixed components can fit poorly and create sharps or tube-release hazards."
  },
  {
    "id": "cc-7-038",
    "ch": 7,
    "page": 230,
    "topic": "ETS",
    "q": "Should a needle be removed from its holder for reuse?",
    "a": "No. Dispose of the attached unit as directed by safety rules."
  },
  {
    "id": "cc-7-039",
    "ch": 7,
    "page": 231,
    "topic": "ETS",
    "q": "What is an evacuated tube?",
    "a": "A tube with negative pressure that automatically draws blood."
  },
  {
    "id": "cc-7-040",
    "ch": 7,
    "page": 232,
    "topic": "ETS",
    "q": "What makes an evacuated tube fill automatically?",
    "a": "The vacuum or negative pressure inside it."
  },
  {
    "id": "cc-7-041",
    "ch": 7,
    "page": 232,
    "topic": "ETS",
    "q": "What may cause an evacuated tube to underfill?",
    "a": "Loss of vacuum, poor positioning, or stopping the draw too early."
  },
  {
    "id": "cc-7-042",
    "ch": 7,
    "page": 232,
    "topic": "ETS",
    "q": "Can a correctly filled tube have an air space above the blood?",
    "a": "Yes. Headspace is normal and does not necessarily mean underfilling."
  },
  {
    "id": "cc-7-043",
    "ch": 7,
    "page": 233,
    "topic": "additives",
    "q": "What is a blood tube additive?",
    "a": "A substance that preserves or changes the specimen for a particular test."
  },
  {
    "id": "cc-7-044",
    "ch": 7,
    "page": 233,
    "topic": "additives",
    "q": "Why must additive tubes fill to their specified volume?",
    "a": "To maintain the correct blood-to-additive ratio."
  },
  {
    "id": "cc-7-045",
    "ch": 7,
    "page": 233,
    "topic": "additives",
    "q": "What is meant by inverting a specimen tube?",
    "a": "Gently turning it upside down and back to mix its contents."
  },
  {
    "id": "cc-7-046",
    "ch": 7,
    "page": 233,
    "topic": "additives",
    "q": "Why should additive tubes be mixed promptly?",
    "a": "To distribute additive and prevent clotting or inaccurate results."
  },
  {
    "id": "cc-7-047",
    "ch": 7,
    "page": 234,
    "topic": "labels",
    "q": "What should be checked on a collection tube before use?",
    "a": "Its expiration date, condition, and required type."
  },
  {
    "id": "cc-7-048",
    "ch": 7,
    "page": 234,
    "topic": "syringe",
    "q": "When is a syringe system sometimes chosen instead of ETS?",
    "a": "For fragile, small, or difficult veins."
  },
  {
    "id": "cc-7-049",
    "ch": 7,
    "page": 234,
    "topic": "syringe",
    "q": "What keeps a syringe needle attached securely?",
    "a": "A compatible Luer-lock connection."
  },
  {
    "id": "cc-7-050",
    "ch": 7,
    "page": 235,
    "topic": "tube colors",
    "q": "What additive is in a light-blue-top tube?",
    "a": "Sodium citrate."
  },
  {
    "id": "cc-7-051",
    "ch": 7,
    "page": 235,
    "topic": "tube colors",
    "q": "Which department commonly uses light-blue-top tubes?",
    "a": "Coagulation."
  },
  {
    "id": "cc-7-052",
    "ch": 7,
    "page": 235,
    "topic": "tube colors",
    "q": "What is the purpose of a gold-top SST?",
    "a": "Collect serum using a clot activator and gel separator."
  },
  {
    "id": "cc-7-053",
    "ch": 7,
    "page": 235,
    "topic": "tube colors",
    "q": "What additive is commonly in a lavender-top tube?",
    "a": "EDTA."
  },
  {
    "id": "cc-7-054",
    "ch": 7,
    "page": 235,
    "topic": "tube colors",
    "q": "What specimen type is commonly collected in a lavender tube?",
    "a": "Whole blood for hematology tests."
  },
  {
    "id": "cc-7-055",
    "ch": 7,
    "page": 235,
    "topic": "tube colors",
    "q": "What additive is commonly found in green-top tubes?",
    "a": "Heparin, usually lithium or sodium heparin."
  },
  {
    "id": "cc-7-056",
    "ch": 7,
    "page": 235,
    "topic": "tube colors",
    "q": "What additives are commonly found in gray-top tubes?",
    "a": "Sodium fluoride with an anticoagulant, often potassium oxalate or EDTA."
  },
  {
    "id": "cc-7-057",
    "ch": 7,
    "page": 235,
    "topic": "tube colors",
    "q": "What do royal-blue-top tubes indicate?",
    "a": "Trace-element-free collection materials; check the label for additive."
  },
  {
    "id": "cc-7-058",
    "ch": 7,
    "page": 235,
    "topic": "tube colors",
    "q": "What is the usual additive in a yellow-top blood culture tube?",
    "a": "Sodium polyanethol sulfonate (SPS)."
  },
  {
    "id": "cc-7-059",
    "ch": 7,
    "page": 235,
    "topic": "tube colors",
    "q": "What is the usual use of pink-top EDTA tubes?",
    "a": "Blood bank testing."
  },
  {
    "id": "cc-7-060",
    "ch": 7,
    "page": 236,
    "topic": "syringe",
    "q": "Why should syringe blood be transferred using a transfer device?",
    "a": "To avoid needle handling, aerosol generation, and needlesticks."
  },
  {
    "id": "cc-7-061",
    "ch": 7,
    "page": 237,
    "topic": "syringe",
    "q": "Why should the syringe plunger not be pushed to force blood into an ETS tube?",
    "a": "Excess pressure can cause hemolysis or dislodge the stopper."
  },
  {
    "id": "cc-7-062",
    "ch": 7,
    "page": 237,
    "topic": "butterfly",
    "q": "When are winged blood collection sets particularly useful?",
    "a": "For small, difficult, or hand veins."
  },
  {
    "id": "cc-7-063",
    "ch": 7,
    "page": 237,
    "topic": "butterfly",
    "q": "What problem can a needle smaller than 23 gauge cause?",
    "a": "A higher risk of hemolysis unless specially designed for safe collection."
  },
  {
    "id": "cc-7-064",
    "ch": 7,
    "page": 238,
    "topic": "butterfly",
    "q": "Why might the first tube with a butterfly set be a discard tube?",
    "a": "To clear air from tubing before a required additive ratio is measured."
  },
  {
    "id": "cc-7-065",
    "ch": 7,
    "page": 238,
    "topic": "butterfly",
    "q": "When a coagulation tube is first with butterfly tubing, what is commonly needed?",
    "a": "A discard tube to remove tubing air before filling the light-blue tube."
  },
  {
    "id": "cc-7-066",
    "ch": 7,
    "page": 239,
    "topic": "additives",
    "q": "Can additives from different tubes be mixed or substituted?",
    "a": "No. Tubes must match the ordered test."
  },
  {
    "id": "cc-7-067",
    "ch": 7,
    "page": 240,
    "topic": "additives",
    "q": "Why are specimen tubes gently inverted instead of shaken?",
    "a": "Shaking can damage blood cells and cause hemolysis."
  },
  {
    "id": "cc-7-068",
    "ch": 7,
    "page": 240,
    "topic": "additives",
    "q": "What are anticoagulants designed to prevent?",
    "a": "Blood clot formation."
  },
  {
    "id": "cc-7-069",
    "ch": 7,
    "page": 241,
    "topic": "EDTA",
    "q": "How does EDTA prevent clotting?",
    "a": "It binds calcium required for the coagulation process."
  },
  {
    "id": "cc-7-070",
    "ch": 7,
    "page": 241,
    "topic": "EDTA",
    "q": "What can excess EDTA from an underfilled tube cause?",
    "a": "Cell shrinkage and inaccurate hematology results."
  },
  {
    "id": "cc-7-071",
    "ch": 7,
    "page": 241,
    "topic": "EDTA",
    "q": "Why must an EDTA sample be mixed right after collection?",
    "a": "To prevent platelet clumping and microclot formation."
  },
  {
    "id": "cc-7-072",
    "ch": 7,
    "page": 242,
    "topic": "citrate",
    "q": "Which tube is used for most PT and aPTT tests?",
    "a": "A properly filled light-blue sodium citrate tube."
  },
  {
    "id": "cc-7-073",
    "ch": 7,
    "page": 242,
    "topic": "citrate",
    "q": "What is the required blood-to-citrate ratio?",
    "a": "9 parts blood to 1 part anticoagulant."
  },
  {
    "id": "cc-7-074",
    "ch": 7,
    "page": 242,
    "topic": "citrate",
    "q": "How many gentle inversions are listed for sodium citrate tubes in this chapter?",
    "a": "3–4 inversions, with the manufacturer's guidance taking precedence."
  },
  {
    "id": "cc-7-075",
    "ch": 7,
    "page": 242,
    "topic": "heparin",
    "q": "How does heparin prevent clotting?",
    "a": "By inhibiting thrombin and related clotting activity."
  },
  {
    "id": "cc-7-076",
    "ch": 7,
    "page": 243,
    "topic": "heparin",
    "q": "Why is lithium-heparin plasma unsuitable for a lithium level?",
    "a": "The additive could falsely elevate the lithium result."
  },
  {
    "id": "cc-7-077",
    "ch": 7,
    "page": 243,
    "topic": "oxalate",
    "q": "How does potassium oxalate prevent clotting?",
    "a": "It precipitates calcium as an insoluble salt."
  },
  {
    "id": "cc-7-078",
    "ch": 7,
    "page": 243,
    "topic": "ACD",
    "q": "What does ACD stand for in a yellow-top specialty tube?",
    "a": "Acid citrate dextrose."
  },
  {
    "id": "cc-7-079",
    "ch": 7,
    "page": 243,
    "topic": "SPS",
    "q": "Besides preventing clotting, why is SPS useful for blood cultures?",
    "a": "It helps preserve organism recovery by reducing certain blood defenses."
  },
  {
    "id": "cc-7-080",
    "ch": 7,
    "page": 244,
    "topic": "fluoride",
    "q": "What is the purpose of sodium fluoride in gray tubes?",
    "a": "To inhibit glycolysis and preserve glucose levels."
  },
  {
    "id": "cc-7-081",
    "ch": 7,
    "page": 244,
    "topic": "fluoride",
    "q": "Does sodium fluoride prevent clotting on its own?",
    "a": "No. Another anticoagulant is often added for plasma samples."
  },
  {
    "id": "cc-7-082",
    "ch": 7,
    "page": 244,
    "topic": "clot activator",
    "q": "What does a clot activator do?",
    "a": "Speeds clot formation in tubes intended to yield serum."
  },
  {
    "id": "cc-7-083",
    "ch": 7,
    "page": 244,
    "topic": "clot activator",
    "q": "What is an RST?",
    "a": "A rapid serum tube containing a thrombin-based clot activator."
  },
  {
    "id": "cc-7-084",
    "ch": 7,
    "page": 244,
    "topic": "separator",
    "q": "What is the purpose of serum or plasma separator material?",
    "a": "To form a barrier between blood cells and the liquid portion after centrifuging."
  },
  {
    "id": "cc-7-085",
    "ch": 7,
    "page": 245,
    "topic": "separator",
    "q": "What is thixotropic gel?",
    "a": "A gel that moves during centrifugation to separate cells from serum or plasma."
  },
  {
    "id": "cc-7-086",
    "ch": 7,
    "page": 245,
    "topic": "trace elements",
    "q": "Why are trace-element-free tubes used?",
    "a": "To minimize contamination when measuring tiny amounts of elements."
  },
  {
    "id": "cc-7-087",
    "ch": 7,
    "page": 245,
    "topic": "order of draw",
    "q": "What is meant by the order of draw?",
    "a": "The sequence in which blood collection tubes are filled."
  },
  {
    "id": "cc-7-088",
    "ch": 7,
    "page": 245,
    "topic": "order of draw",
    "q": "Why is the order of draw important?",
    "a": "It reduces carryover of additives and specimen contamination."
  },
  {
    "id": "cc-7-089",
    "ch": 7,
    "page": 246,
    "topic": "order of draw",
    "q": "Which specimen is collected first in the CLSI order of draw?",
    "a": "Blood culture bottles or sterile collection tubes."
  },
  {
    "id": "cc-7-090",
    "ch": 7,
    "page": 246,
    "topic": "order of draw",
    "q": "What tube category follows blood cultures?",
    "a": "Light-blue sodium citrate tubes."
  },
  {
    "id": "cc-7-091",
    "ch": 7,
    "page": 246,
    "topic": "order of draw",
    "q": "What tube category follows citrate tubes?",
    "a": "Serum tubes, including red and gold SST tubes."
  },
  {
    "id": "cc-7-092",
    "ch": 7,
    "page": 246,
    "topic": "order of draw",
    "q": "What follows serum tubes in the usual order of draw?",
    "a": "Heparin tubes, usually green or light green."
  },
  {
    "id": "cc-7-093",
    "ch": 7,
    "page": 246,
    "topic": "order of draw",
    "q": "What follows heparin tubes in the usual order of draw?",
    "a": "EDTA tubes, usually lavender or pink."
  },
  {
    "id": "cc-7-094",
    "ch": 7,
    "page": 246,
    "topic": "order of draw",
    "q": "Which tube category is usually collected last?",
    "a": "Gray oxalate/fluoride tubes."
  },
  {
    "id": "cc-7-095",
    "ch": 7,
    "page": 246,
    "topic": "order of draw",
    "q": "Recite the standard order of draw in six groups.",
    "a": "Cultures → citrate → serum → heparin → EDTA → gray fluoride/oxalate."
  },
  {
    "id": "cc-7-096",
    "ch": 7,
    "page": 247,
    "topic": "contamination",
    "q": "What is additive carryover?",
    "a": "Movement of tube additive into a subsequent blood specimen."
  },
  {
    "id": "cc-7-097",
    "ch": 7,
    "page": 247,
    "topic": "contamination",
    "q": "What false result can EDTA carryover cause?",
    "a": "Falsely high potassium and low calcium."
  },
  {
    "id": "cc-7-098",
    "ch": 7,
    "page": 247,
    "topic": "contamination",
    "q": "What should you do after accidentally filling an incorrect additive tube first?",
    "a": "Follow facility policy; use a discard tube before resuming the correct order."
  },
  {
    "id": "cc-7-099",
    "ch": 7,
    "page": 247,
    "topic": "contamination",
    "q": "Why can tissue thromboplastin interfere with some coagulation tests?",
    "a": "It activates the clotting pathway after tissue contamination."
  },
  {
    "id": "cc-7-100",
    "ch": 7,
    "page": 248,
    "topic": "contamination",
    "q": "What special contamination issue is critical when collecting blood cultures?",
    "a": "Skin or handling microorganisms can create false-positive cultures."
  },
  {
    "id": "cc-8-001",
    "ch": 8,
    "page": 252,
    "topic": "chapter overview",
    "q": "What is the focus of Chapter 8?",
    "a": "Safe, accurate venipuncture procedures from request through transport."
  },
  {
    "id": "cc-8-002",
    "ch": 8,
    "page": 253,
    "topic": "patient registration",
    "q": "Why is patient registration important before collection?",
    "a": "It links the patient's identity to the test request and specimen labels."
  },
  {
    "id": "cc-8-003",
    "ch": 8,
    "page": 253,
    "topic": "patient registration",
    "q": "What is a patient-specific identifier?",
    "a": "A unique identifier such as the patient's medical record number."
  },
  {
    "id": "cc-8-004",
    "ch": 8,
    "page": 254,
    "topic": "requisition",
    "q": "What is a test requisition?",
    "a": "A request that specifies the patient, tests, and collection requirements."
  },
  {
    "id": "cc-8-005",
    "ch": 8,
    "page": 254,
    "topic": "requisition",
    "q": "Name two important identifiers on a test requisition.",
    "a": "Patient full name and a unique patient-specific identifier."
  },
  {
    "id": "cc-8-006",
    "ch": 8,
    "page": 254,
    "topic": "requisition",
    "q": "What additional information may a requisition require?",
    "a": "Test, provider, priority, collection date/time, and special instructions."
  },
  {
    "id": "cc-8-007",
    "ch": 8,
    "page": 254,
    "topic": "requisition",
    "q": "Why are barcode requisitions useful?",
    "a": "They speed accurate identification and reduce transcription mistakes."
  },
  {
    "id": "cc-8-008",
    "ch": 8,
    "page": 254,
    "topic": "requisition",
    "q": "What is the first step of the venipuncture process?",
    "a": "Receive, review, and accession the test request."
  },
  {
    "id": "cc-8-009",
    "ch": 8,
    "page": 256,
    "topic": "requisition",
    "q": "What must be checked when reviewing a test request?",
    "a": "Completeness, label match, timing, priorities, and special requirements."
  },
  {
    "id": "cc-8-010",
    "ch": 8,
    "page": 256,
    "topic": "requisition",
    "q": "What should be done about a discrepancy on the requisition?",
    "a": "Resolve it with the appropriate provider before collection."
  },
  {
    "id": "cc-8-011",
    "ch": 8,
    "page": 257,
    "topic": "priority",
    "q": "What does STAT mean for specimen collection?",
    "a": "Collect immediately because results are urgently needed."
  },
  {
    "id": "cc-8-012",
    "ch": 8,
    "page": 257,
    "topic": "priority",
    "q": "What does ASAP mean?",

  {

  {

  const shuffled = (input) => {const a=[...input];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

    const text=String(value ?? '').trim();

  };
  const chapterTitle = (card) => card.ch > 0 ? `Chapter ${card.ch}` : (card.chapterLabel || 'Other shared cards');

  const readCachedCards = () => {
    try {
      const v=JSON.parse(localStorage.getItem(CLOUD_CACHE_KEY) || 'null');

    } catch { return []; }
  };

    const seen=new Map();

      const key=normalizeQuestion(cloud);
      // A Supabase copy of an original question updates it without duplicating the card.

          if(!q||!a)return null;
          const ch=numberFromChapter(row.chapter);
          const chapterLabel=ch?`Chapter ${ch}`:(String(row.chapter??'').trim().slice(0,70)||'Other shared cards');
          return {id:`supabase-${row.id}`,ch,chapterLabel,q,a,page:null,topic:'Shared online'};
        }).filter(Boolean);
        try{localStorage.setItem(CLOUD_CACHE_KEY,JSON.stringify({cards:cloudCards,updatedAt:Date.now()}));}catch{}
        rebuildBuiltin();
        if(!decks().some(d=>d.id===state.deckId))state.deckId='all';
        state.cloudCount=cloudCards.length;
        state.cloudStatus='ready';
      }catch(err){
        state.cloudStatus='offline';
        state.cloudError=String(err?.message||err);
        console.warn('Cindy Cards cloud sync failed:',state.cloudError);
      }finally{
        clearTimeout(timeout);
        if(state.screen==='home')render();
      }
    })();
    try{await syncInFlight;}finally{syncInFlight=null;}
  }

  function icon(c){return ({flash:'▣',learn:'✦',cram:'ϟ'})[c]||'•';}
  function renderHome(){
    const d=getDeck(), cards=d.cards, known=cards.filter(c=>pFor(c.id).known).length, mastered=cards.filter(c=>pFor(c.id).learned).length;
    const sidebar = `<aside class="sidebar"><div class="brand"><span class="brand-mark">✚</span> Cindy Cards</div><div><div class="nav-label">STUDY DECKS</div><div class="deck-list">${decks().map(deck=>`<button data-key="deck-${escapeHTML(deck.id)}" data-action="deck" data-id="${escapeHTML(deck.id)}" class="deck-btn ${deck.id===state.deckId?'active':''}"><span class="deck-dot"></span>${escapeHTML(deck.name)}</button>`).join('')}</div></div><div class="sidebar-bottom"><button data-key="import-sidebar" class="outline-btn" data-action="import">＋ Import locally</button><div class="tiny-muted">Your study progress is saved only in this browser. Shared questions load from Supabase.</div></div></aside>`;
    return `<div class="app-shell">${sidebar}<main class="content"><div class="topbar"><div class="mobile-header"><span class="brand-mark" style="width:30px;height:30px;font-size:19px">✚</span> Cindy Cards</div><div class="badge"><span class="status-dot"></span> Ready to study</div><div class="topbar-actions"><button data-key="cycle" data-action="cycle" class="mini-btn" title="Switch chapter/deck">${escapeHTML(d.short || d.name)} ▾</button><button data-key="view" data-action="view" class="mini-btn" title="Switch to or from glasses preview">${state.glasses?'PC view':'Glasses view'}</button></div></div>
      <div class="eyebrow">PHLEBOTOMY • STUDY SPACE</div><h1 class="headline">Learn it. <em>Remember it.</em></h1><p class="lede">${escapeHTML(d.name)} · ${cards.length} flashcards. Practice what matters and keep track of what sticks.</p>
      <div class="cloud-strip" role="status"><span class="cloud-indicator ${state.cloudStatus==='ready'?'connected':state.cloudStatus==='offline'?'error':''}"></span><span>${escapeHTML(syncLabel())}</span><button data-key="sync" data-action="sync" class="mini-btn" ${state.cloudStatus==='syncing'?'disabled':''}>↻ Refresh</button></div>
      <div class="stats"><div class="stat"><div class="stat-number">${cards.length}</div><div class="stat-caption">Total cards</div></div><div class="stat"><div class="stat-number">${known}</div><div class="stat-caption">Marked known</div></div><div class="stat"><div class="stat-number">${mastered}</div><div class="stat-caption">Learn mastered</div></div></div>
      <div class="section-heading"><h2>Choose a study mode</h2><span class="result-chip">${escapeHTML(d.short||'')}</span></div>
      <div class="modes">
        <button data-key="mode-flash" class="mode-card flash" data-action="flash"><span class="mode-icon">${icon('flash')}</span><span class="mode-name">Flashcards</span><span class="mode-desc">Flip through questions and answers. Flag what you know and what needs another look.</span><span class="mode-cta">Start reviewing →</span></button>
        <button data-key="mode-learn" class="mode-card learn" data-action="learn"><span class="mode-icon">${icon('learn')}</span><span class="mode-name">Learn</span><span class="mode-desc">Practice with multiple choice. Get each answer right twice to master a card.</span><span class="mode-cta">Start learning →</span></button>
        <button data-key="mode-cram" class="mode-card cram" data-action="cram"><span class="mode-icon">${icon('cram')}</span><span class="mode-name">Cram</span><span class="mode-desc">Three-minute sprint. Answer fast and revisit the questions you miss.</span><span class="mode-cta">Start a sprint →</span></button>
      </div><div class="note"><b>Study source:</b> ${safeCards.length} original practice cards based on your photographed textbook pages (Chapters 7–9), plus ${cloudCards.length} shared Supabase records (matching questions are merged). ${state.cloudStatus==='offline'?`<b>Sync error:</b> ${escapeHTML(state.cloudError)}. `:''}Review your course materials and local procedures for clinical requirements. <button data-key="export" data-action="export" class="export-link">Export selected deck for Quizlet ↗</button> <button data-key="import-mobile" data-action="import" class="danger-link" style="color:var(--mint)">Import a personal deck →</button></div></main></div>`;
  }
  function studyHeader(mode, value, max){const d=getDeck();return `<div class="study-top"><button data-action="home" class="back-btn">← Back to decks</button><span class="name">${escapeHTML(d.name)}</span><span class="mode-tag">${escapeHTML(mode)}</span></div><div class="progress-header"><span>${escapeHTML(value)}</span><span>${escapeHTML(max)}</span></div>`;}
  function renderFlash(){
    const d=getDeck(), count=state.seq.length;
    if (!count) return `<div class="app-shell"><main class="content"><div class="study-shell"><p>No cards in this deck.</p><button data-action="home" class="action-btn">Back</button></div></main></div>`;
    const card=state.seq[state.index], side=state.flipped?'ANSWER':'QUESTION', body=state.flipped?card.a:card.q;
    return `<div class="app-shell"><main class="content"><div class="study-shell">${studyHeader('Flashcards',`Card ${state.index+1} of ${count}`,`${state.seq.filter(c=>pFor(c.id).known).length} known`)}<div class="progress-track"><div class="progress-fill" style="width:${percent(state.index+1,count)}%"></div></div><div class="source-ref">${card.page?`Chapter ${card.ch} · p. ${card.page} · ${escapeHTML(card.topic)}`:`${escapeHTML(d.name)}`}</div><button class="flashcard" data-action="flip"><span class="card-side">${side}</span><span class="card-text">${escapeHTML(body)}</span><span class="card-hint">${state.flipped?'Select to show question':'Select to reveal answer'}</span></button><div class="card-actions"><div class="action-group"><button data-action="again" class="action-btn again">Don’t know it</button><button data-action="known" class="action-btn know">Know it</button></div><div class="action-group"><button data-action="prev" class="action-btn" aria-label="Previous card">← Prev</button><button data-action="next" class="action-btn" aria-label="Next card">Next →</button></div></div><div class="key-help">Arrows move highlight · Select / Enter activates · Back / Esc returns to decks<br><button data-action="shuffle" class="danger-link" style="color:var(--blue)">Shuffle deck</button></div></div></main></div>`;
  }
  function freshOptions(card, pool){
    const other=shuffled(pool.filter(c=>c.id!==card.id && c.a!==card.a));
    const picked=[], seen=new Set([card.a]);
    const add=list=>{for(const c of list){if(!seen.has(c.a)){picked.push(c.a);seen.add(c.a);}if(picked.length===3)break;}};
    add(other.filter(c=>c.topic===card.topic && c.ch===card.ch));
    if(picked.length<3) add(other.filter(c=>c.ch===card.ch));
    if(picked.length<3) add(other);
    return shuffled([card.a,...picked.slice(0,3)]);
  }
  function nextQuestion(){
    const q=state.quiz;
    if(!q || !q.queue.length){finishQuiz();return;}
    q.current=q.queue[0];
    const card=q.cards.find(c=>c.id===q.current);
    q.options=freshOptions(card,getDeck().cards);
    q.selected=0;
    q.feedback=null;
  }
  function startMode(mode){
    const d=getDeck();if(!d.cards.length)return;
    if(state.screen==='home')pushStudyHistory();
    state.screen=mode;state.finished=null;
    if(mode==='flash') {state.seq=[...d.cards];state.index=0;state.flipped=false;state.quiz=null;}
    else {
      const ordered=shuffled(d.cards).sort((a,b)=>(Number(pFor(a.id).learned)-Number(pFor(b.id).learned)) || (pFor(a.id).correct - pFor(b.id).correct));
      const cards=ordered.slice(0,Math.min(12,d.cards.length));
      state.quiz={mode,cards,queue:cards.map(c=>c.id),streak:{},current:null,options:[],selected:0,feedback:null,correct:0,attempts:0,mastered:0,misses:0,deadline:mode==='cram'?Date.now()+180000:null};
      nextQuestion();
    }
    render(mode==='flash'?'flip':'option-0');
  }
  function answerQuiz(){const q=state.quiz;if(!q || q.feedback)return;
    const card=q.cards.find(c=>c.id===q.current), answer=q.options[q.selected];if(!card)return;
    const correct=answer===card.a;q.attempts++;if(correct)q.correct++;else q.misses++;
    const p=pFor(card.id);if(correct)p.correct++;else p.misses++;
    const previous=q.streak[card.id]||0;
    q.streak[card.id]=correct?previous+1:0;
    if (q.mode==='learn' && q.streak[card.id]>=2) p.learned=true;
    q.feedback={correct,answer};save();render('advance');
  }
  function afterAnswer(){const q=state.quiz;if(!q)return;
    const id=q.current, correct=q.feedback?.correct;
    q.queue.shift();
    if(q.mode==='learn'){
      if((q.streak[id]||0)>=2)q.mastered++;
      else q.queue.push(id);
    }else if(!correct){q.queue.push(id);}
    if(q.mode==='cram' && Date.now()>=q.deadline){finishQuiz();return;}
    if(!q.queue.length){finishQuiz();return;}
    nextQuestion();render('option-0');
  }
  function finishQuiz(){const q=state.quiz;if(!q)return;state.finished={mode:q.mode,attempts:q.attempts,correct:q.correct,misses:q.misses,mastered:q.mastered,total:q.cards.length};state.quiz=null;state.screen='results';render('restart');}
  function renderQuiz(){const q=state.quiz;if(!q)return '';
    const card=q.cards.find(c=>c.id===q.current), isCram=q.mode==='cram';
    const progressCount=isCram?q.cards.length-Math.min(q.queue.length,q.cards.length):q.mastered;
    const progressMax=q.cards.length;
    const timer=isCram?`<span class="timer" id="clock">${niceTime((q.deadline-Date.now())/1000)}</span>`:`<span class="result-chip">${q.mastered} mastered · ${q.misses} misses</span>`;
    return `<div class="app-shell"><main class="content"><div class="study-shell">${studyHeader(isCram?'Cram sprint':'Learn', isCram?`${q.attempts} answered · ${q.misses} wrong`:`Mastered ${q.mastered} of ${q.cards.length}`,isCram?'3-minute sprint':'Two correct to master')}<div class="progress-track"><div class="progress-fill" style="width:${percent(progressCount,progressMax)}%"></div></div><div class="study-top"><span class="eyebrow">${isCram?'SPEED ROUND':'PRACTICE QUESTION'}</span>${timer}</div><div class="question-box"><p class="question-label">${card.page?`Chapter ${card.ch} · p. ${card.page} · ${escapeHTML(card.topic)}`:"Choose the correct answer"}</p><div class="question-text">${escapeHTML(card.q)}</div></div><div class="answers">${q.options.map((opt,i)=>{const given=q.feedback;let cls=q.selected===i?' chosen':'';if(given){if(opt===card.a)cls+=' correct';else if(opt===given.answer)cls+=' wrong';}return `<button class="option${cls}" data-action="option" data-option="${i}" ${given?'disabled':''} ><span class="letter">${'ABCD'[i]}</span><span>${escapeHTML(opt)}</span></button>`;}).join('')}</div>
    ${q.feedback?`<div class="feedback ${q.feedback.correct?'':'bad'}"><strong>${q.feedback.correct?'Correct!':'Not quite.'}</strong> ${q.feedback.correct?(q.mode==='learn' && q.streak[q.current]<2?'One more correct answer to master it.':'Nice work.'): `Correct answer: ${escapeHTML(card.a)}`}</div>`:''}
    <div class="study-footer"><span class="result-chip">${isCram?'Missed cards come back':'Keep going until each card is mastered'}</span><button class="action-btn primary" data-action="${q.feedback?'advance':'submit'}">${q.feedback?'Continue →':'Check answer'}</button></div><div class="key-help">Arrows move highlight · Select / Enter activates · Back / Esc returns to decks</div></div></main></div>`;
  }
  function renderResults(){const r=state.finished;const isCram=r.mode==='cram';return `<div class="app-shell"><main class="content"><div class="study-shell"><div class="study-top"><button class="back-btn" data-action="home">← Back to decks</button><span class="mode-tag">${isCram?'CRAM COMPLETE':'LEARN COMPLETE'}</span></div><div class="summary"><div class="summary-emoji">${isCram?'⚡':'✦'}</div><h2>${isCram?'Sprint finished!':'Session mastered!'}</h2><p>${isCram?'Great work under the clock. Try another sprint or review the cards again.':'Each practice card was answered correctly twice in this session.'}</p><div class="summary-grid"><div><b>${r.correct}</b><span>Correct answers</span></div><div><b>${r.misses}</b><span>Missed answers</span></div><div><b>${percent(r.correct,r.attempts)}%</b><span>Accuracy</span></div></div><div class="action-group" style="justify-content:center"><button data-key="restart" data-action="restart" class="action-btn primary">Practice again</button><button data-key="home" data-action="home" class="action-btn">Back to decks</button></div></div></div></main></div>`;}
  function renderImport(){return `<div class="modal-screen"><div class="modal-box"><button data-action="home" class="back-btn">← Back to decks</button><p class="eyebrow">ADD YOUR OWN MATERIAL</p><h1>Import flashcards</h1><p>Paste Quizlet export text (one card per line, with a tab between question and answer) or choose a TSV, TXT, or CSV file. This creates a <b>personal deck on this device only</b>. To share cards with your girlfriend's glasses, import a CSV into the <b>flashcards</b> table in Supabase and press Refresh on the Cindy Cards home screen.</p><label class="field-label" for="deckname">Deck name</label><input id="deckname" class="text-field" maxlength="80" placeholder="Chapter 7 textbook review" value="${escapeHTML(state.importName)}"><label class="field-label" for="deckfile">Upload study cards</label><input id="deckfile" class="text-field" type="file" accept=".tsv,.txt,.csv,.json,text/plain,text/tab-separated-values,text/csv,application/json"><label class="field-label" for="importtext">Or paste questions and answers</label><textarea id="importtext" class="text-field import-text" placeholder="What is EDTA?&#9;An additive that binds calcium.&#10;What is a CBC?&#9;Complete blood count.">${escapeHTML(state.importText)}</textarea><div class="modal-buttons"><button data-action="create-deck" class="action-btn primary">Import cards</button><button data-action="home" class="action-btn">Cancel</button></div><p class="import-status" id="importstatus">${escapeHTML(state.importNotice)}</p></div></div>`;}
  function render(preferred = focusKey(document.activeElement)){
    document.body.classList.toggle('glasses',state.glasses);const root=$('#app');
    root.innerHTML=state.screen==='home'?renderHome():state.screen==='flash'?renderFlash():['learn','cram'].includes(state.screen)?renderQuiz():state.screen==='results'?renderResults():renderImport();
    const controls = visibleControls();
    const fallback = state.screen==='home'?'mode-flash':state.screen==='flash'?'flip':'home';
    const target = controls.find(el => focusKey(el) === preferred)
      || controls.find(el => focusKey(el) === fallback) || controls[0];
    focusControl(target);
    document.title=`${state.screen==='home'?'Study Deck':state.screen==='results'?'Results':state.screen} · Cindy Cards`;
  }
  function changeDeck(id){state.deckId=id;state.screen='home';save();render();}
  function step(n, preferred){if(!state.seq.length)return;state.index=(state.index+n+state.seq.length)%state.seq.length;state.flipped=false;render(preferred);}
  function rating(isKnown){const c=state.seq[state.index];if(!c)return;const p=pFor(c.id);p.known=isKnown;if(!isKnown)p.misses++;save();step(1,'flip');}
  function parseImported(input){const text=input.replace(/^\uFEFF/,'').trim();if(!text)return [];
    if(text[0]==='['){try{const obj=JSON.parse(text);if(Array.isArray(obj))return obj.map(c=>({q:String(c.q??c.question??c.front??c.term??''),a:String(c.a??c.answer??c.back??c.definition??'')})).filter(c=>c.q&&c.a);}catch{}}
    const result=[];
    for(const line of text.split(/\r?\n/)){
      if(!line.trim())continue;
      let fields;
      if(line.includes('\t'))fields=line.split(/\t/);
      else if(line.includes(' | '))fields=line.split(/ \| /);
      else if(line.includes(';'))fields=line.split(';');
      else if(line.includes(',')){
        // Standard quoted CSV fields and double-quote escaping.
        fields=[];let v='',inside=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(inside&&line[i+1]==='"'){v+='"';i++;}else inside=!inside;}else if(ch===','&&!inside){fields.push(v);v='';}else v+=ch;}fields.push(v);
      }else continue;
      if(fields.length>=2){const q=fields[0].trim().replace(/^"|"$/g,''),a=fields.slice(1).join(line.includes('\t')?'\t':', ').trim();if(q&&a)result.push({q,a});}
    }
    return result;
  }
  function importDeck(){state.importName=$('#deckname')?.value.trim()||'';state.importText=$('#importtext')?.value||'';
    const cards=parseImported(state.importText);
    if(!cards.length){state.importNotice='No cards found. Use a TAB between each question and answer.';$('#importstatus').textContent=state.importNotice;return;}
    const id='custom-'+Date.now()+'-'+Math.floor(Math.random()*1000);
    userDecks.push({id,name:state.importName||`Imported deck (${cards.length})`,short:'Custom deck',cards:cards.map((c,i)=>({...c,id:id+'-'+i,ch:0}))});
    state.importNotice='';state.importName='';state.importText='';state.deckId=id;save();goHome();
  }
  function downloadDeck(){const deck=getDeck();const body=deck.cards.map(c=>`${c.q.replace(/[\t\r\n]+/g,' ')}\t${c.a.replace(/[\t\r\n]+/g,' ')}`).join('\n');const file=new Blob([body],{type:'text/tab-separated-values;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=deck.name.replace(/[^\w-]+/g,'_')+'.tsv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
  function handleAction(action, el){
    switch(action){
      case 'home':goHome();break;
      case 'view':state.glasses=!state.glasses;render();break;
      case 'sync':refreshCloudCards();break;
      case 'cycle':{const ds=decks(),i=ds.findIndex(d=>d.id===state.deckId);changeDeck(ds[(i+1)%ds.length].id);break;}
      case 'deck':changeDeck(el.dataset.id);break;
      case 'flash':case 'learn':case 'cram':state.homeFocus=focusKey(el);startMode(action);break;
      case 'flip':state.flipped=!state.flipped;render('flip');break;
      case 'prev':step(-1,'prev');break;
      case 'next':step(1,'next');break;
      case 'known':rating(true);break;
      case 'again':rating(false);break;
      case 'shuffle':state.seq=shuffled(state.seq);state.index=0;state.flipped=false;render('flip');break;
      case 'option':{const q=state.quiz;if(!q||q.feedback)return;q.selected=Number(el.dataset.option);answerQuiz();break;}
      case 'submit':answerQuiz();break;
      case 'advance':afterAnswer();break;
      case 'restart':startMode(state.finished?.mode||'flash');break;
      case 'import':state.homeFocus=focusKey(el);if(state.screen==='home')pushStudyHistory();state.screen='import';render('home');break;
      case 'create-deck':importDeck();break;
      case 'export':downloadDeck();break;
    }
  }
  $('#app').addEventListener('click',(event)=>{const el=event.target.closest('[data-action]');if(el)handleAction(el.dataset.action,el);});
  $('#app').addEventListener('change',async(event)=>{if(event.target.id==='deckfile'){const field=event.target;const file=field.files[0];if(!file)return;try{const contents=await file.text();if(!field.isConnected || field.files[0]!==file)return;state.importText=contents;$('#importtext').value=contents;$('#importstatus').textContent=`Loaded ${file.name}. Click Import cards to save.`;}catch{if(field.isConnected)$('#importstatus').textContent='Could not read this file.';}}});
  let lastFocus;

  function focusKey(el){
    if(el?.dataset.option !== undefined) return 'option-' + el.dataset.option;
    return el?.dataset.key || el?.id || el?.dataset.action;
  }

  function visibleControls(){
    return Array.from(document.querySelectorAll('#app :is(button,input,textarea):enabled'))
      .filter(el => el.getClientRects().length);
  }

  function focusControl(el){
    if(!el)return;
    el.focus({preventScroll:true});
    el.scrollIntoView({block:'nearest',inline:'nearest'});
  }

  function pushStudyHistory(){
    // A native/browser Back gesture can pop this entry rather than closing the site.
    try{history.pushState({cindyCardsScreen:true},'',location.href);}catch{}
  }
  function goHome(fromBack=false){
    state.screen='home';
    state.quiz=null;
    state.finished=null;
    render(state.homeFocus);
    if(!fromBack && history.state?.cindyCardsScreen){try{history.back();}catch{}}
  }
  window.addEventListener('popstate',()=>{if(state.screen!=='home')goHome(true);});

  $('#app').addEventListener('focusin', (event) => {
    lastFocus = focusKey(event.target);
    const q = state.quiz;
    if(!q || q.feedback || event.target.dataset.option === undefined)return;
    q.selected = Number(event.target.dataset.option);
    for(const option of document.querySelectorAll('.option')){
      option.classList.toggle('chosen', option === event.target);
    }
  });

  document.addEventListener('keydown', (event) => {
    const {key, target} = event;
    if(event.defaultPrevented || event.isComposing || event.altKey || event.ctrlKey || event.metaKey)return;
    const inField = target.matches?.('input,textarea');
    if(key==='Escape' || key==='BrowserBack' || key==='GoBack' || key==='Back' || (key==='Backspace' && !inField)){
      if(state.screen==='home')return;
      event.preventDefault();
      if(!event.repeat)goHome();
      return;
    }

    const direction = {ArrowLeft:-1, ArrowUp:-1, ArrowRight:1, ArrowDown:1}[key];
    if(direction && (!inField || state.glasses)){
      const controls = visibleControls();
      if(!controls.length)return;
      const current = controls.indexOf(document.activeElement);
      const next = current < 0 ? 0 : (current + direction + controls.length) % controls.length;
      event.preventDefault();
      focusControl(controls[next]);
      return;
    }
    if(inField)return;

    if(key==='Enter' || key===' '){
      // Activate once, even in a host that only delivers the keydown event.
      const button = target.closest?.('#app button:enabled');
      if(!button && target!==document.body)return;
      event.preventDefault();
      if(event.repeat)return;
      const selected = button || visibleControls().find(el=>focusKey(el)===lastFocus);
      if(selected instanceof HTMLButtonElement){
        focusControl(selected);
        selected.click();
      }
      return;
    }
    if(key.toLowerCase()==='s' && state.screen==='flash'){
      event.preventDefault();
      if(!event.repeat)handleAction('shuffle');
      return;
    }
    if(state.quiz && /^[1-4]$/.test(key)){
      event.preventDefault();
      if(!event.repeat)document.querySelector('button[data-option="' + (Number(key)-1) + '"]:enabled')?.click();
    }
  });
  setInterval(()=>{if(state.screen==='cram'&&state.quiz){const secs=(state.quiz.deadline-Date.now())/1000;if(secs<=0){finishQuiz();return;}const el=$('#clock');if(el)el.textContent=niceTime(secs);}},250);
  render();
  // Built-in questions are immediately usable; shared cards refresh asynchronously.
  refreshCloudCards();
  window.CindyCardsTest={parseImported,getDeck,percent,numberFromChapter,refreshCloudCards};
})();
</script></body></html>
